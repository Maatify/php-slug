services:
  mysql:
    image: mysql:8.0.36
    environment:
      MYSQL_DATABASE: maatify_slug_test
      MYSQL_USER: slug_test
      MYSQL_PASSWORD: slug_test_password
      MYSQL_ROOT_PASSWORD: slug_test_root_password
    ports:
      - "127.0.0.1::3306"
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping --protocol=tcp -h 127.0.0.1 -uroot -pslug_test_root_password
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
